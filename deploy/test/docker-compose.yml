services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - internal

  db-init:
    image: ${GHCR_IMAGE_DB_INIT}:${IMAGE_TAG}
    environment:
      DATABASE_URL: mongodb://mongodb:27017/klick-and-zeugnis?replicaSet=rs0
      MONGODB_COLLECTION_PREFIX: test_
      PRISMA_CLIENT_ENGINE_TYPE: binary
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      FORCE_SEED_RESET: ${FORCE_SEED_RESET:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-mail@hendrik-beier.de}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-12092025}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        node scripts/sync-prisma-collections.mjs
        npx prisma generate --schema=prisma/.schema.resolved.prisma
        npx prisma db push --schema=prisma/.schema.resolved.prisma --skip-generate
        SEED_ADMIN_EMAIL="$$SEED_ADMIN_EMAIL" node prisma/ensure-admin.runtime.cjs
        if [ "$$RUN_DB_SEED" = "true" ]; then
          FORCE_SEED_RESET="$$FORCE_SEED_RESET" \
          SEED_ADMIN_EMAIL="$$SEED_ADMIN_EMAIL" \
          SEED_ADMIN_PASSWORD="$$SEED_ADMIN_PASSWORD" \
          node prisma/seed.runtime.cjs
        fi
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    profiles:
      - init

  app:
    image: ${GHCR_IMAGE_APP}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/klick-and-zeugnis?replicaSet=rs0
      MONGODB_COLLECTION_PREFIX: test_
      NEXTAUTH_URL: https://test.klick-and-zeugnis.de
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRISMA_CLIENT_ENGINE_TYPE: binary
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: klick-proxy
      traefik.http.routers.klick-test.rule: "Host(`test.klick-and-zeugnis.de`)"
      traefik.http.routers.klick-test.entrypoints: websecure
      traefik.http.routers.klick-test.tls: "true"
      traefik.http.routers.klick-test.tls.certresolver: letsencrypt
      traefik.http.routers.klick-test.service: klick-test
      traefik.http.services.klick-test.loadbalancer.server.port: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  internal:
  proxy:
    external: true
    name: klick-proxy

volumes:
  mongodb_data:
