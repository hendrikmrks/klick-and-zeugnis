services:
  mongodb:
    image: mongo:7
    container_name: klick-and-zeugnis-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-init
      args:
        MONGODB_COLLECTION_PREFIX: ${MONGODB_COLLECTION_PREFIX:-local_}
    container_name: klick-and-zeugnis-db-init
    environment:
      DATABASE_URL: mongodb://mongodb:27017/klick-and-zeugnis?replicaSet=rs0
      MONGODB_COLLECTION_PREFIX: ${MONGODB_COLLECTION_PREFIX:-local_}
      PRISMA_CLIENT_ENGINE_TYPE: binary
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      FORCE_SEED_RESET: ${FORCE_SEED_RESET:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-mail@hendrik-beier.de}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Synchronisiere Prisma-Schema …"
        node scripts/sync-prisma-collections.mjs
        npx prisma generate --schema=prisma/.schema.resolved.prisma
        echo "Wende Datenbankschema an …"
        npx prisma db push --schema=prisma/.schema.resolved.prisma --skip-generate
        SEED_ADMIN_EMAIL="$$SEED_ADMIN_EMAIL" node prisma/ensure-admin.runtime.cjs
        if [ "$$RUN_DB_SEED" = "true" ]; then
          echo "Spiele Seed-Daten ein (FORCE_SEED_RESET=$$FORCE_SEED_RESET) …"
          FORCE_SEED_RESET="$$FORCE_SEED_RESET" node prisma/seed.runtime.cjs
        else
          echo "Seed übersprungen (RUN_DB_SEED=false)."
        fi
        echo "Datenbank-Initialisierung abgeschlossen."
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        MONGODB_COLLECTION_PREFIX: ${MONGODB_COLLECTION_PREFIX:-local_}
    container_name: klick-and-zeugnis-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mongodb://mongodb:27017/klick-and-zeugnis?replicaSet=rs0
      MONGODB_COLLECTION_PREFIX: ${MONGODB_COLLECTION_PREFIX:-local_}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-secret-bitte-in-produktion-aendern}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRISMA_CLIENT_ENGINE_TYPE: binary
    depends_on:
      db-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
