services:
  mongodb:
    image: mongo:7
    container_name: klick-and-zeugnis-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: klick-and-zeugnis-db-init
    environment:
      DATABASE_URL: mongodb://mongodb:27017/klick-and-zeugnis?replicaSet=rs0
      MONGODB_COLLECTION_PREFIX: local_
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
    command:
      - /bin/sh
      - -c
      - |
        node scripts/sync-prisma-collections.mjs
        npx prisma db push --schema=prisma/.schema.resolved.prisma --skip-generate
        if [ "$$RUN_DB_SEED" = "true" ]; then
          FORCE_SEED_RESET=true node prisma/seed.runtime.cjs
        fi
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klick-and-zeugnis-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://mongodb:27017/klick-and-zeugnis?replicaSet=rs0
      MONGODB_COLLECTION_PREFIX: local_
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-secret-bitte-in-produktion-aendern}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
