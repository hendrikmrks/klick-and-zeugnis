name: Deploy Test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COLLECTION_PREFIX: test_
  DEPLOY_ROOT: /opt/klick-and-zeugnis

jobs:
  deploy:
    runs-on: [self-hosted, klick]
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Lint
        run: npm ci && npm run lint

      - name: Prepare image names
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_app=${{ env.REGISTRY }}/${REPO_LC}-app" >> "$GITHUB_OUTPUT"
          echo "image_db_init=${{ env.REGISTRY }}/${REPO_LC}-db-init" >> "$GITHUB_OUTPUT"
          echo "image_tag=test-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            MONGODB_COLLECTION_PREFIX=${{ env.COLLECTION_PREFIX }}
          tags: |
            ${{ steps.meta.outputs.image_app }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_app }}:test

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: db-init
          push: true
          build-args: |
            MONGODB_COLLECTION_PREFIX=${{ env.COLLECTION_PREFIX }}
          tags: |
            ${{ steps.meta.outputs.image_db_init }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_db_init }}:test

      - name: Sync deploy configs
        run: |
          for dir in traefik test prod scripts; do
            mkdir -p "${{ env.DEPLOY_ROOT }}/$dir"
            rsync -a --exclude '.env' "deploy/$dir/" "${{ env.DEPLOY_ROOT }}/$dir/"
          done
          chmod +x "${{ env.DEPLOY_ROOT }}/scripts/"*.sh

      - name: Start Traefik
        run: |
          bash "${{ env.DEPLOY_ROOT }}/scripts/start-traefik.sh"

      - name: Deploy test stack
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          "${{ env.DEPLOY_ROOT }}/scripts/deploy.sh" test "${IMAGE_TAG}"
