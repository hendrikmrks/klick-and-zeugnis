name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COLLECTION_PREFIX: prod_

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image names
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.event.release.tag_name }}"
          echo "image_app=${{ env.REGISTRY }}/${REPO_LC}-app" >> "$GITHUB_OUTPUT"
          echo "image_db_init=${{ env.REGISTRY }}/${REPO_LC}-db-init" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            MONGODB_COLLECTION_PREFIX=${{ env.COLLECTION_PREFIX }}
          tags: |
            ${{ steps.meta.outputs.image_app }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_app }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: db-init
          push: true
          build-args: |
            MONGODB_COLLECTION_PREFIX=${{ env.COLLECTION_PREFIX }}
          tags: |
            ${{ steps.meta.outputs.image_db_init }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_db_init }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Upload deploy configs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/traefik,deploy/test,deploy/prod,deploy/scripts
          target: /opt/klick-and-zeugnis
          strip_components: 1

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            chmod +x /opt/klick-and-zeugnis/scripts/*.sh
            if ! docker network inspect klick-proxy >/dev/null 2>&1; then
              docker network create klick-proxy
            fi
            cd /opt/klick-and-zeugnis/traefik
            docker compose -p klick-proxy-stack up -d
            /opt/klick-and-zeugnis/scripts/deploy.sh prod "${IMAGE_TAG}"
