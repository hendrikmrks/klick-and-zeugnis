name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COLLECTION_PREFIX: prod_
  DEPLOY_ROOT: /opt/klick-and-zeugnis

jobs:
  deploy:
    runs-on: [self-hosted, klick]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image names
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.event.release.tag_name }}"
          echo "image_app=${{ env.REGISTRY }}/${REPO_LC}-app" >> "$GITHUB_OUTPUT"
          echo "image_db_init=${{ env.REGISTRY }}/${REPO_LC}-db-init" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            MONGODB_COLLECTION_PREFIX=${{ env.COLLECTION_PREFIX }}
          tags: |
            ${{ steps.meta.outputs.image_app }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_app }}:prod

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: db-init
          push: true
          build-args: |
            MONGODB_COLLECTION_PREFIX=${{ env.COLLECTION_PREFIX }}
          tags: |
            ${{ steps.meta.outputs.image_db_init }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_db_init }}:prod

      - name: Sync deploy configs
        run: |
          for dir in traefik test prod scripts; do
            mkdir -p "${{ env.DEPLOY_ROOT }}/$dir"
            rsync -a --exclude '.env' "deploy/$dir/" "${{ env.DEPLOY_ROOT }}/$dir/"
          done
          chmod +x "${{ env.DEPLOY_ROOT }}/scripts/"*.sh

      - name: Start Traefik
        run: |
          if ! docker network inspect klick-proxy >/dev/null 2>&1; then
            docker network create klick-proxy
          fi
          cd "${{ env.DEPLOY_ROOT }}/traefik"
          docker compose -p klick-proxy-stack pull
          docker compose -p klick-proxy-stack up -d --force-recreate

      - name: Deploy production stack
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          "${{ env.DEPLOY_ROOT }}/scripts/deploy.sh" prod "${IMAGE_TAG}"
